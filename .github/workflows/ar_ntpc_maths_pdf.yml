name: AR Publication - NTPC Maths PDF (Gemini)

on:
  workflow_dispatch:
    inputs:
      start_page:
        description: "Book ka pehla page"
        default: "1"
      end_page:
        description: "Book ka aakhri page"
        default: "330"
  schedule:
    - cron: "17 */2 * * *"   # har 2 ghante: jo page baaki hain wahi banenge (Gemini limit bhari ho to turant ruk jaata hai; sab bane hon to kuch nahi)

permissions:
  contents: write

concurrency:
  group: ar-ntpc-maths
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      # GEMINI_API_KEY_PDF ho to wo, warna repo ki purani GEMINI_API_KEY
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_PDF || secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ar_publication
            .github

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # apt (ubuntu server) ki zaroorat nahi: PDF padhna pip se, Hindi font repo mein, Chrome runner par pehle se
      - name: Tools
        run: |
          pip install requests playwright pypdfium2 pillow
          python -m playwright install chromium || echo "runner ka Google Chrome use hoga"

      - name: Gemini se sawaal + hal
        working-directory: ar_publication/ntpc_maths
        timeout-minutes: 300
        continue-on-error: true   # beech mein ruke tab bhi bane hue page save honge
        run: python -u gemini_solve.py "${{ inputs.start_page || '1' }}" "${{ inputs.end_page || '330' }}"

      - name: Data save (repo mein)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ar_publication/ntpc_maths/data ar_publication/ntpc_maths/review.txt 2>/dev/null || true
          git commit -m "NTPC maths: Gemini pages (run ${{ github.run_number }})" || echo "kuch naya nahi"
          git pull --rebase origin main && git push

      - name: PDF banao
        if: always()
        run: python ar_publication/ntpc_maths/build_pdf.py

      - name: PDF download ke liye
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AR_Publication_NTPC_Maths_PDF
          path: ar_publication/ntpc_maths/out/RRB_NTPC_Maths_PYQ_Solutions_AR_Publication.pdf
          retention-days: 14
