name: AR Publication - NTPC Maths + Reasoning PDF (Gemini)
# Ab ek se zyada books: ntpc_maths, ntpc_reasoning (har book ka folder ar_publication/<book>/ mein, book.json ke saath)

on:
  workflow_dispatch:
    inputs:
      book:
        description: "Kaun si book (all = sab)"
        default: "all"
        type: choice
        options: [all, ntpc_reasoning, ntpc_maths]
      start_page:
        description: "Book ka pehla page"
        default: "1"
      end_page:
        description: "Book ka aakhri page"
        default: "999"
  schedule:
    - cron: "17 */2 * * *"   # har 2 ghante: jo page baaki hain wahi banenge (Gemini limit bhari ho to turant ruk jaata hai; sab bane hon to kuch nahi)

permissions:
  contents: write

concurrency:
  group: ar-ntpc-maths
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      # GEMINI_API_KEY_PDF ho to wo, warna repo ki purani GEMINI_API_KEY
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_PDF || secrets.GEMINI_API_KEY }}
      # Extra keys (alag Google projects/accounts) = utna guna zyada free quota. Jo secret na ho wo khaali rehta hai.
      GEMINI_API_KEYS: "${{ secrets.GEMINI_API_KEY_PDF }},${{ secrets.GEMINI_KEY_2 }},${{ secrets.GEMINI_KEY_3 }},${{ secrets.GEMINI_KEY_4 }},${{ secrets.GEMINI_KEY_5 }},${{ secrets.GEMINI_API_KEY }}"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ar_publication
            .github

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # apt (ubuntu server) ki zaroorat nahi: PDF padhna pip se, Hindi font repo mein, Chrome runner par pehle se
      - name: Tools
        run: |
          pip install requests playwright pypdfium2 pillow
          python -m playwright install chromium || echo "runner ka Google Chrome use hoga"

      - name: Gemini se sawaal + hal
        timeout-minutes: 300
        continue-on-error: true   # beech mein ruke tab bhi bane hue page save honge
        run: |
          BOOKS="${{ inputs.book || 'all' }}"
          [ "$BOOKS" = "all" ] && BOOKS="ntpc_reasoning ntpc_maths"
          for B in $BOOKS; do
            echo "=== $B ==="
            BOOK_DIR=ar_publication/$B python -u ar_publication/ntpc_maths/gemini_solve.py "${{ inputs.start_page || '1' }}" "${{ inputs.end_page || '999' }}" || true
          done

      - name: Data save (repo mein)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ar_publication/*/data ar_publication/*/figs ar_publication/*/review.txt 2>/dev/null || true
          git commit -m "NTPC maths: Gemini pages (run ${{ github.run_number }})" || echo "kuch naya nahi"
          git pull --rebase origin main && git push

      - name: PDF banao
        if: always()
        run: |
          for B in ntpc_reasoning ntpc_maths; do
            ls ar_publication/$B/data/*.json >/dev/null 2>&1 && BOOK_DIR=ar_publication/$B python ar_publication/ntpc_maths/build_pdf.py || true
          done

      - name: PDF download ke liye
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AR_Publication_NTPC_PDFs
          path: ar_publication/*/out/*.pdf
          retention-days: 14
