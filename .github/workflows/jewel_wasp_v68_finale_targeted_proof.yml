name: Jewel Wasp V6.8 Finale Targeted DRAFT Proof
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/jewel_wasp_v68_finale_targeted_proof.yml"
permissions:
  contents: read
concurrency:
  group: jewel-wasp-v68-finale-targeted-proof
  cancel-in-progress: true
jobs:
  finale-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and FFmpeg
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender"
          curl -fL --retry 3 --connect-timeout 25 --max-time 650 -o "$RUNNER_TEMP/blender.tar.xz" "https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz"
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1
          echo "$RUNNER_TEMP/blender" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libopengl0 ffmpeg
      - name: Finale geometry and camera preflight
        run: |
          set -euo pipefail
          mkdir -p finale-proof
          python3 -m py_compile src/jewel_wasp_v68_anatomy_proof.py src/jewel_wasp_v68_story_draft.py
          JW_MODE=preflight JW_CHAPTER=13 BLENDER_OUTPUT="$RUNNER_TEMP/unused.png" xvfb-run -a blender -b -t 2 --python src/jewel_wasp_v68_story_draft.py > finale-proof/preflight.log 2>&1 || { tail -n 100 finale-proof/preflight.log; exit 1; }
          grep -q "JW_V68_STORY_GEOMETRY_PREFLIGHT_PASS 13" finale-proof/preflight.log
      - name: Render two actual story frames and the burrow emergence motion
        run: |
          set -euo pipefail
          for frame in 45 180; do
            JW_MODE=still JW_CHAPTER=13 JW_STILL_FRAME="$frame" JW_RES_PERCENT=100 BLENDER_OUTPUT="$PWD/finale-proof/ch13_f$frame.png" xvfb-run -a blender -b -t 2 --python src/jewel_wasp_v68_story_draft.py > "finale-proof/still_$frame.log" 2>&1 || { tail -n 100 "finale-proof/still_$frame.log"; exit 1; }
            test -s "finale-proof/ch13_f$frame.png"
          done
          JW_MODE=motion JW_CHAPTER=13 JW_MOTION_START=25 JW_RES_PERCENT=75 BLENDER_OUTPUT="$PWD/finale-proof/ch13_emergence_raw.mp4" xvfb-run -a blender -b -t 2 --python src/jewel_wasp_v68_story_draft.py > finale-proof/motion.log 2>&1 || { tail -n 100 finale-proof/motion.log; exit 1; }
          ffmpeg -y -loglevel error -i finale-proof/ch13_emergence_raw.mp4 -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='DRAFT CH 13':x=8:y=8:fontsize=18:fontcolor=white:box=1:boxcolor=black@0.6" -an -c:v libx264 -preset veryfast -crf 24 finale-proof/ch13_emergence_DRAFT.mp4
          rm finale-proof/ch13_emergence_raw.mp4
          ffmpeg -v error -xerror -i finale-proof/ch13_emergence_DRAFT.mp4 -f null -
          test "$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of default=nw=1:nk=1 finale-proof/ch13_emergence_DRAFT.mp4)" = 24
          ffmpeg -y -loglevel error -i finale-proof/ch13_emergence_DRAFT.mp4 -vf "select='eq(n,0)+eq(n,7)+eq(n,15)+eq(n,23)',scale=270:480,tile=4x1" -frames:v 1 finale-proof/ch13_emergence_strip.png
      - name: Record DRAFT-only unapproved QA metadata
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib,os
          p=pathlib.Path("finale-proof");p.mkdir(exist_ok=True)
          (p/"QA.json").write_text(json.dumps(dict(
              source_sha=os.environ.get("GITHUB_SHA"),
              chapter=13, still_frames=[45,180],
              motion_frames=list(range(25,49)),
              draft_only=True,visual_approved=False,final_film=False,
              status="Technical motion proof only; human visual review required"
          ),indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jewel-wasp-v68-ch13-finale-draft-proof
          path: finale-proof/
          retention-days: 14
          if-no-files-found: warn
