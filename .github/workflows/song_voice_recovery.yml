name: Recover lyrics from isolated voice
on:
  push:
    branches: ['feature/song-animation-metaphors-20261030']
    paths: ['.github/workflows/song_voice_recovery.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libsndfile1
          pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install 'numpy<2' 'soundfile>=0.12,<1' demucs==4.0.1 'faster-whisper>=1.1,<2' 'requests>=2.31,<3'
      - run: python -m song_animation.voice_recovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: song-voice-recovery
          path: song_recovery/
          retention-days: 7
