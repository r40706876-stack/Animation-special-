name: Science Documentary Studio
on:
  push:
    paths:
      - "src/documentary.py"
      - "src/documentary_topics.json"
      - ".github/workflows/documentary.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * *"
permissions:
  contents: write
concurrency:
  group: science-documentary
  cancel-in-progress: false
jobs:
  documentary:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      STORY_VOICE: hi-IN-SwaraNeural
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core
          pip install requests Pillow edge-tts
      - name: Validate Python source
        run: python -m compileall -q src
      - name: Validate offline scripts for every topic
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          topics=json.loads(Path("src/documentary_topics.json").read_text(encoding="utf-8"))["topics"]
          backup=json.loads(Path("src/documentary_fallback.json").read_text(encoding="utf-8"))
          for topic in topics:
              item=backup.get(topic["subject"])
              assert item, "Missing backup: "+topic["subject"]
              assert len(item["scenes"])==8, "Wrong scene count: "+topic["subject"]
              assert len(item["narration"].split())>=65, "Narration too short: "+topic["subject"]
              assert sum(s.get("visual_type") in ("diagram","comparison","mechanism") for s in item["scenes"])>=3
          print("OFFLINE_STORYBOARDS_PASS",len(topics))
          PY
      - name: Offline cinematic render smoke test
        run: python tests/test_documentary_render.py
      - name: Generate cinematic documentary
        run: python src/documentary.py
      - name: Save output
        if: success()
        run: |
          git config user.name "documentary-bot"
          git config user.email "documentary-bot@users.noreply.github.com"
          git add documentary_state.json videos/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate science documentary episode"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 8
          done
          exit 1
      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentary-output
          path: videos/SCIENCE_EP_*
          if-no-files-found: warn

