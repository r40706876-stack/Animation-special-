name: Song original CPU character test
on:
  push:
    branches: ['main']
    paths:
      - song_animation/cpu_character_probe.py
      - song_animation/local_image.py
      - song_animation/flux_layers.py
      - song_animation/environments.py
      - song_animation/requirements-painted.txt
      - song_animation/requirements-cutouts.txt
      - .github/workflows/song_cpu_character.yml
permissions: {contents: read}
jobs:
  original-character:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcairo2
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r song_animation/requirements-painted.txt -r song_animation/requirements-cutouts.txt 'Pillow>=10,<13'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--stabilityai--sd-turbo
          key: song-painted-sd-turbo-b261bac6
      - run: python -m song_animation.cpu_character_probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-cpu-character
          path: cpu_character_probe/
          retention-days: 7
