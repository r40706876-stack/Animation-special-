name: Song multiscene end-to-end acceptance
on:
  push:
    branches: ['main']
    paths: ['song_animation/environments.py', 'song_animation/paint_layers.py', 'song_animation/painted_backend_probe.py', '.github/workflows/song_multiscene_acceptance.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: song-multiscene-acceptance
  cancel-in-progress: false
jobs:
  song:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ""
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "120"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-cjk libcairo2
          pip install -r song_animation/requirements.txt
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r song_animation/requirements-painted.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--stabilityai--sd-turbo
          key: song-painted-sd-turbo-b261bac6
      - uses: actions/cache/restore@v4
        with:
          path: |
            song_multiscene/analysis_checkpoint.json
            song_multiscene/lyrics.json
            song_multiscene/vector_assets/
            song_multiscene/storyboard.json
            song_multiscene/vector_checkpoint.json
            song_multiscene/painted_environments/
            song_multiscene/painted_actors/
          key: song-acceptance-v8-${{ hashFiles('song_animation/inputs/song_1000076620.m4a') }}-${{ github.run_id }}
          restore-keys: |
            song-acceptance-v8-${{ hashFiles('song_animation/inputs/song_1000076620.m4a') }}-
      - name: Uploaded song through automatic multiscene pipeline
        run: python -m song_animation.run --audio song_animation/inputs/song_1000076620.m4a --out song_multiscene --width 1080 --artwork painted-layers
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            song_multiscene/analysis_checkpoint.json
            song_multiscene/lyrics.json
            song_multiscene/vector_assets/
            song_multiscene/storyboard.json
            song_multiscene/vector_checkpoint.json
            song_multiscene/painted_environments/
            song_multiscene/painted_actors/
          key: song-acceptance-v8-${{ hashFiles('song_animation/inputs/song_1000076620.m4a') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: song-multiscene-review
          path: song_multiscene/
          retention-days: 7
  art-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "120"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core libcairo2
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r song_animation/requirements-painted.txt 'Pillow>=10,<13' 'CairoSVG>=2.7,<3'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--stabilityai--sd-turbo
          key: song-painted-sd-turbo-b261bac6
      - run: python -m song_animation.painted_backend_probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: painted-backend-proof
          path: painted_backend_probe/
          retention-days: 7
