name: Directed story for the supplied ghazal audio
on:
  push:
    branches: ['main']
    paths: ['song_animation/examples/poet_story_film.py', 'song_animation/assets/poet_story/**', '.github/workflows/song_poet_directed.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core
          pip install 'Pillow>=10,<13' 'numpy>=1.26,<3'
      - run: python -m song_animation.examples.poet_story_film --audio song_animation/inputs/song_1000076620.m4a --out directed_story
      - run: ffmpeg -v error -xerror -i directed_story/new_song_story_30s.mp4 -f null -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: directed-poet-story
          path: directed_story/
          retention-days: 7
