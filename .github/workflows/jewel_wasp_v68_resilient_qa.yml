name: Jewel Wasp V6.8 resilient DRAFT evidence (parallel chapter proofs)
on:
  workflow_dispatch:
  push:
    paths:
      - "ops/JW_V68_RESILIENT_QA_REQUEST.txt"
permissions:
  contents: read
concurrency:
  group: jw-v68-resilient-evidence
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender for cheap geometry checks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender"
          curl -fL --retry 3 --connect-timeout 25 --max-time 650 -o "$RUNNER_TEMP/blender.tar.xz" https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1
          echo "$RUNNER_TEMP/blender" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libopengl0
      - name: Fail before pixel rendering on invalid geometry or camera framing
        run: |
          set -euo pipefail
          python3 -m py_compile src/jewel_wasp_v68_anatomy_proof.py src/jewel_wasp_v68_story_draft.py
          for ch in 1 3 5 8 10 11 12; do
            JW_MODE=preflight JW_CHAPTER="$ch" BLENDER_OUTPUT="$RUNNER_TEMP/unused.png" xvfb-run -a blender -b -t 2 --python src/jewel_wasp_v68_story_draft.py > "$RUNNER_TEMP/preflight_$ch.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/preflight_$ch.log"; exit 1; }
            grep -q "JW_V68_STORY_GEOMETRY_PREFLIGHT_PASS $ch" "$RUNNER_TEMP/preflight_$ch.log"
          done

  stills:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Reuse exact-source validated stills on retry
        id: cache
        uses: actions/cache@v4
        with:
          path: evidence/stills
          key: jw-v68-stills-${{ runner.os }}-${{ hashFiles('src/jewel_wasp_v68_story_draft.py','src/jewel_wasp_v68_anatomy_proof.py') }}
      - name: Install Blender only if stills are missing
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender"
          curl -fL --retry 3 --connect-timeout 25 --max-time 650 -o "$RUNNER_TEMP/blender.tar.xz" https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1
          echo "$RUNNER_TEMP/blender" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libopengl0
      - name: Render missing distinct 360x640 action-aware stills
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p evidence/stills
          for ch in $(seq 0 13); do
            case "$ch" in 3|5) f=145;; 10) f=195;; 11) f=205;; 12) f=180;; *) f=120;; esac
            target="evidence/stills/chapter_$(printf '%02d' "$ch").png"
            JW_MODE=still JW_CHAPTER="$ch" JW_STILL_FRAME="$f" JW_RES_PERCENT=100 BLENDER_OUTPUT="$PWD/$target" xvfb-run -a blender -b -t 2 --python src/jewel_wasp_v68_story_draft.py > "evidence/stills/chapter_$ch.log" 2>&1 || { tail -n 80 "evidence/stills/chapter_$ch.log"; exit 1; }
            test -s "$target"
          done
      - name: Verify all 14 images, including cache hits
        run: |
          set -euo pipefail
          for ch in $(seq 0 13); do test -s "evidence/stills/chapter_$(printf '%02d' "$ch").png"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-v68-proof-stills
          path: evidence/stills/
          if-no-files-found: warn
          retention-days: 14

  motion:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 140
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { chapter: 1, start: 90 }
          - { chapter: 3, start: 118 }
          - { chapter: 5, start: 118 }
          - { chapter: 8, start: 118 }
          - { chapter: 10, start: 168 }
          - { chapter: 11, start: 152 }
          - { chapter: 12, start: 112 }
    steps:
      - uses: actions/checkout@v4
      - name: Reuse exact-source successful 24-frame action proof
        id: cache
        uses: actions/cache@v4
        with:
          path: evidence/motion
          key: jw-v68-motion-${{ runner.os }}-${{ hashFiles('src/jewel_wasp_v68_story_draft.py','src/jewel_wasp_v68_anatomy_proof.py') }}-ch-${{ matrix.chapter }}
      - name: Install Blender and ffmpeg for uncached proof
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender"
          curl -fL --retry 3 --connect-timeout 25 --max-time 650 -o "$RUNNER_TEMP/blender.tar.xz" https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1
          echo "$RUNNER_TEMP/blender" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libopengl0 ffmpeg
      - name: Render real action frames and permanently stamp DRAFT
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p evidence/motion
          ch=${{ matrix.chapter }}
          JW_MODE=motion JW_CHAPTER="$ch" JW_MOTION_START=${{ matrix.start }} JW_RES_PERCENT=75 BLENDER_OUTPUT="$PWD/evidence/motion/raw_$ch.mp4" xvfb-run -a blender -b -t 2 --python src/jewel_wasp_v68_story_draft.py > "evidence/motion/action_$ch.log" 2>&1 || { tail -n 100 "evidence/motion/action_$ch.log"; exit 1; }
          ffmpeg -y -loglevel error -i "evidence/motion/raw_$ch.mp4" -vf "drawtext=text='DRAFT CH $ch - NOT FINAL':x=8:y=8:fontsize=18:fontcolor=white:box=1:boxcolor=black@0.65" -an -c:v libx264 -preset veryfast -crf 24 "evidence/motion/action_$ch.mp4"
          ffmpeg -y -loglevel error -i "evidence/motion/action_$ch.mp4" -vf "select='eq(n,0)+eq(n,7)+eq(n,15)+eq(n,23)',scale=270:480,tile=4x1" -frames:v 1 "evidence/motion/action_$ch-strip.png"
          rm -f "evidence/motion/raw_$ch.mp4"
      - name: Verify 24 decodable frames, including cache hits
        run: |
          set -euo pipefail
          ch=${{ matrix.chapter }}
          test -s "evidence/motion/action_$ch.mp4"
          test -s "evidence/motion/action_$ch-strip.png"
          ffmpeg -v error -xerror -i "evidence/motion/action_$ch.mp4" -f null -
          test "$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of default=nw=1:nk=1 "evidence/motion/action_$ch.mp4")" = 24
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-v68-proof-motion-${{ matrix.chapter }}
          path: evidence/motion/
          if-no-files-found: warn
          retention-days: 14

  evidence:
    needs: [stills, motion]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download available independent proof artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: jw-v68-proof-*
          path: evidence/all
          merge-multiple: true
      - name: Assemble contact sheet and report without claiming visual approval
        run: |
          set -euo pipefail
          mkdir -p evidence/report
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 - <<'PY'
          import pathlib,json,os
          p=pathlib.Path("evidence/all")
          stills=[p/f"chapter_{i:02d}.png" for i in range(14)]
          motions=[p/f"action_{i}.mp4" for i in (1,3,5,8,10,11,12)]
          strips=[p/f"action_{i}-strip.png" for i in (1,3,5,8,10,11,12)]
          missing=[str(x) for x in stills+motions+strips if not x.is_file() or x.stat().st_size==0]
          report={"source_sha":os.environ.get("GITHUB_SHA"),"draft_only":True,"final_approved":False,"human_visual_qa":False,"hindi_audio_qa":False,"still_count":sum(x.is_file() for x in stills),"motion_count":sum(x.is_file() for x in motions),"missing":missing}
          pathlib.Path("evidence/report/DRAFT_QA.json").write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          if missing:raise SystemExit("Missing independent proof artifacts; never approve incomplete evidence")
          PY
          ffmpeg -y -loglevel error -framerate 1 -i evidence/all/chapter_%02d.png -vf "scale=360:640,drawtext=text='DRAFT - NOT FINAL':x=8:y=8:fontsize=20:fontcolor=white:box=1:boxcolor=black@0.65,tile=7x2" -frames:v 1 evidence/report/DRAFT_14_CHAPTER_CONTACT.png
          test -s evidence/report/DRAFT_14_CHAPTER_CONTACT.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jw-v68-resilient-qa-summary-DRAFT
          path: evidence/report/
          if-no-files-found: warn
          retention-days: 14
