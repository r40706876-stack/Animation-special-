name: Blender Octopus 3D Demo
on:
  workflow_dispatch:
  push:
    paths:
      - "src/blender_octopus_demo.py"
      - "src/animation_library.py"
      - "src/scene_library.py"
      - ".github/workflows/blender_3d.yml"
concurrency:
  group: blender-octopus-3d
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        timeout-minutes: 22
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          if command -v blender >/dev/null && command -v ffmpeg >/dev/null && command -v xvfb-run >/dev/null; then
            echo "Using installed Blender, FFmpeg and Xvfb"
          else
            # Bound apt/network stalls so the run fails with a useful error
            # instead of spending most of the 90-minute job timeout here.
            for attempt in 1 2; do
              echo "Blender package installation attempt ${attempt}/2"
              if timeout --signal=TERM --kill-after=30s 300s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq &&
                 timeout --signal=TERM --kill-after=30s 540s sudo apt-get install -y --no-install-recommends blender ffmpeg xvfb; then
                break
              fi
              if [ "$attempt" -eq 2 ]; then
                echo "::error::Blender dependencies could not be installed after two bounded attempts"
                exit 1
              fi
              sleep 10
            done
          fi
          command -v blender
          command -v ffmpeg
          command -v xvfb-run
          blender --version | head -n 2
      - name: Render 3D demo
        run: |
          mkdir -p videos
          set -o pipefail
          BLENDER_OUTPUT="$PWD/videos/OCTOPUS_3D_DEMO.mp4" xvfb-run -a blender -b -t 2 --python src/blender_octopus_demo.py 2>&1 | tee videos/blender_render.log
          test -s videos/OCTOPUS_3D_DEMO.mp4
          # ffprobe alone does not prove that all frames are decodable.
          ffmpeg -v error -xerror -i videos/OCTOPUS_3D_DEMO.mp4 -f null -
          ffprobe -v error -show_entries format=duration,size -of json videos/OCTOPUS_3D_DEMO.mp4
          ffmpeg -y -loglevel error -ss 2.5 -i videos/OCTOPUS_3D_DEMO.mp4 -frames:v 1 videos/OCTOPUS_3D_PREVIEW.jpg
          ffmpeg -y -loglevel error -i videos/OCTOPUS_3D_DEMO.mp4 -vf "select=eq(n\\,12)+eq(n\\,60)+eq(n\\,108),scale=270:480,tile=3x1" -frames:v 1 videos/OCTOPUS_3D_CONTACT.jpg
      - name: Save rendered video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: octopus-3d-demo
          path: |
            videos/OCTOPUS_3D_DEMO.mp4
            videos/blender_render.log
            videos/OCTOPUS_3D_PREVIEW.jpg
            videos/OCTOPUS_3D_CONTACT.jpg
          if-no-files-found: warn

      - name: Persist Blender QA result for automatic inspection
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          folder=pathlib.Path("videos")
          folder.mkdir(exist_ok=True)
          video=folder/"OCTOPUS_3D_DEMO.mp4"
          log=folder/"blender_render.log"
          result={"video_exists":video.exists(),"video_bytes":video.stat().st_size if video.exists() else 0}
          if video.exists():
              probe=subprocess.run(["ffprobe","-v","error","-show_entries","format=duration,size","-of","json",str(video)],capture_output=True,text=True)
              if probe.returncode==0:
                  result["probe"]=json.loads(probe.stdout).get("format",{})
          if log.exists():
              result["log_tail"]=log.read_text(errors="replace").splitlines()[-45:]
          result["render_verified"]=bool(result.get("video_bytes",0)>100000 and float(result.get("probe",{}).get("duration",0))>=4.0)
          (folder/"blender_run_status.json").write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print("BLENDER_QA",json.dumps({k:v for k,v in result.items() if k!="log_tail"}))
          PY
          git config user.name "blender-demo-bot"
          git config user.email "blender-demo-bot@users.noreply.github.com"
          git add -f videos/blender_run_status.json
          if [ -f videos/blender_render.log ]; then git add -f videos/blender_render.log; fi
          if [ -s videos/OCTOPUS_3D_DEMO.mp4 ]; then git add -f videos/OCTOPUS_3D_DEMO.mp4; fi
          if [ -s videos/OCTOPUS_3D_PREVIEW.jpg ]; then git add -f videos/OCTOPUS_3D_PREVIEW.jpg; fi
          if [ -s videos/OCTOPUS_3D_CONTACT.jpg ]; then git add -f videos/OCTOPUS_3D_CONTACT.jpg; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Blender 3D demo render and QA result"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase -X theirs origin/main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 8
          done
          exit 1
