name: Verify last words of supplied song
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/song_1000076620_transcript.yml']
permissions:
  contents: read
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install faster-whisper==1.2.1
      - run: |
          python - <<'PY'
          import subprocess,json
          from pathlib import Path
          from faster_whisper import WhisperModel
          subprocess.run(['ffmpeg','-v','error','-y','-ss','16','-i','song_animation/inputs/song_1000076620.m4a','-t','18','-ac','1','-ar','16000','voice.wav'],check=True)
          model=WhisperModel('large-v3',device='cpu',compute_type='int8',cpu_threads=2,num_workers=1)
          segments,info=model.transcribe('voice.wav',language='hi',word_timestamps=True,condition_on_previous_text=False,beam_size=5,vad_filter=False,temperature=0)
          result={'language_basis':'Hindi established by direct audio transcription; language fixed only for this independent verification','segments':[{'start':s.start+16,'end':s.end+16,'text':s.text,'words':[{'text':w.word,'start':w.start+16,'end':w.end+16,'probability':w.probability} for w in s.words or []]} for s in segments]}
          Path('tail_transcript.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supplied-song-tail-transcript
          path: tail_transcript.json
          retention-days: 7
