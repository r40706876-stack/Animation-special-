name: Daily Katha Reel

on:
  schedule:
    - cron: "22 3 * * *"   # roz subah 8:52 IST
  workflow_dispatch:        # Actions tab se "Run workflow" dabakar kabhi bhi

permissions:
  contents: write

concurrency:
  group: katha-reel
  cancel-in-progress: false

jobs:
  make-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WHISPER_MODEL: large-v3-turbo # Hindi ke liye behtar (pehli baar ~1.5GB download, phir cache)
      GEMINI_MODEL: ""             # khaali = code khud sabse naya free model chunega
      FPS: "24"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System packages (ffmpeg + Hindi font)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Python packages
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Whisper model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ env.WHISPER_MODEL }}

      - name: Video banao
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/main.py

      - name: Video ko videos/ folder mein save karo
        run: |
          git config user.name "katha-bot"
          git config user.email "katha-bot@users.noreply.github.com"
          git add -A audio purani_audio videos
          if git diff --cached --quiet; then echo "Kuch naya nahi"; exit 0; fi
          git commit -m "Nayi video: $(date +%F)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          exit 1
