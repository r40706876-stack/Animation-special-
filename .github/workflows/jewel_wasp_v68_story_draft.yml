name: Jewel Wasp V6.8 14-Chapter Story DRAFT Previews
on:
  push:
    paths:
      - "src/jewel_wasp_v68_story_draft.py"
      - ".github/workflows/jewel_wasp_v68_story_draft.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jewel-wasp-v68-story-draft-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender 4.2 and ffmpeg
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender"
          curl -fL --retry 3 --connect-timeout 25 --max-time 650 -o "$RUNNER_TEMP/blender.tar.xz" "https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz"
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1
          echo "$RUNNER_TEMP/blender" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libopengl0 ffmpeg
      - name: Preflight source and 14-chapter story contract
        run: |
          set -euo pipefail
          python3 -m py_compile src/jewel_wasp_v68_anatomy_proof.py src/jewel_wasp_v68_story_draft.py
          python3 - <<'PY'
          from pathlib import Path
          source=Path("src/jewel_wasp_v68_story_draft.py").read_text()
          anatomy=Path("src/jewel_wasp_v68_anatomy_proof.py").read_text()
          assert anatomy.count("# Independent roach macro still complements")==1
          assert "ANATOMY_WASP_ROOT" in anatomy and "ANATOMY_ROACH_ROOT" in anatomy
          assert "assert 0 <= chapter < 14" in source
          assert "scene.frame_end=240" in source
          assert "exec(compile(code.split(boundary)[0]" in source
          print("V68_DRAFT_INTEGRATION_PREFLIGHT_PASS")
          PY
      - name: Blender action geometry preflight (no expensive render)
        run: |
          set -euo pipefail
          mkdir -p preview
          for chapter in 1 3 5 8 10 11 12; do
            echo "BLENDER_PREFLIGHT_CHAPTER $chapter"
            JW_MODE=preflight JW_CHAPTER="$chapter" BLENDER_OUTPUT="$RUNNER_TEMP/unused.png" xvfb-run -a blender -b -t 2 --python src/jewel_wasp_v68_story_draft.py > "preview/preflight_$chapter.log" 2>&1 || { tail -n 120 "preview/preflight_$chapter.log"; exit 1; }
            grep -q "JW_V68_STORY_GEOMETRY_PREFLIGHT_PASS $chapter" "preview/preflight_$chapter.log"
          done
      - name: Render 14 genuinely different 3D chapter stills (DRAFT)
        run: |
          set -euo pipefail
          mkdir -p preview
          for chapter in $(seq 0 13); do
            echo "RENDER_DRAFT_CHAPTER_STILL $chapter"
            # Inspect the actual narrative action, not a generic mid-chapter frame.
            case "$chapter" in
              3|5) still=145 ;;
              10) still=195 ;;
              11) still=205 ;;
              12) still=180 ;;
              *) still=120 ;;
            esac
            JW_STILL_FRAME="$still" JW_MODE=still JW_CHAPTER="$chapter" JW_RES_PERCENT=60 BLENDER_OUTPUT="$PWD/preview/chapter_$(printf '%02d' "$chapter").png" xvfb-run -a blender -b -t 2 --python src/jewel_wasp_v68_story_draft.py > "preview/chapter_$(printf '%02d' "$chapter").log" 2>&1 || { tail -n 100 "preview/chapter_$(printf '%02d' "$chapter").log"; exit 1; }
            grep -q "JW_V68_STORY_DRAFT_RENDER_DONE $chapter still" "preview/chapter_$(printf '%02d' "$chapter").log"
            test -s "preview/chapter_$(printf '%02d' "$chapter").png"
          done
          ffmpeg -y -loglevel error -framerate 1 -i preview/chapter_%02d.png -vf "scale=360:640,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='DRAFT CH %{n}':x=12:y=12:fontsize=21:fontcolor=white:box=1:boxcolor=black@0.65,tile=7x2" -frames:v 1 preview/DRAFT_14_CHAPTER_CONTACT.png
          test -s preview/DRAFT_14_CHAPTER_CONTACT.png
      - name: Render real 1-second animated action previews
        run: |
          set -euo pipefail
          for chapter in 1 3 5 8 10 11 12; do
            # Motion proofs must overlap the actual action: the previous generic
            # 108-131 window missed burrow descent and egg placement entirely.
            case "$chapter" in
              1) motion_start=90 ;;
              3|5) motion_start=118 ;;
              8) motion_start=118 ;;
              10) motion_start=168 ;;
              11) motion_start=152 ;;
              12) motion_start=112 ;;
            esac
            echo "RENDER_DRAFT_ACTION_MOTION $chapter"
            JW_MOTION_START="$motion_start" JW_MODE=motion JW_CHAPTER="$chapter" JW_RES_PERCENT=60 BLENDER_OUTPUT="$PWD/preview/action_$chapter.mp4" xvfb-run -a blender -b -t 2 --python src/jewel_wasp_v68_story_draft.py > "preview/action_$chapter.log" 2>&1 || { tail -n 100 "preview/action_$chapter.log"; exit 1; }
            grep -q "JW_V68_STORY_DRAFT_RENDER_DONE $chapter motion" "preview/action_$chapter.log"
            # Visibly mark every preview video; never pass a proof off as final.
            ffmpeg -y -loglevel error -i "preview/action_$chapter.mp4" -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='DRAFT CH $chapter':x=8:y=8:fontsize=18:fontcolor=white:box=1:boxcolor=black@0.55" -an -c:v libx264 -preset veryfast -crf 24 "preview/action_${chapter}_marked.mp4"
            mv "preview/action_${chapter}_marked.mp4" "preview/action_$chapter.mp4"
            ffmpeg -v error -xerror -i "preview/action_$chapter.mp4" -f null -
            frames="$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of default=nw=1:nk=1 "preview/action_$chapter.mp4")"
            test "$frames" = 24
            ffmpeg -y -loglevel error -i "preview/action_$chapter.mp4" -vf "select='eq(n,0)+eq(n,7)+eq(n,15)+eq(n,23)',scale=270:480,tile=4x1" -frames:v 1 "preview/action_$chapter-strip.png"
          done
          echo "DRAFT_MOTION_TECHNICAL_PASS__VISUAL_REVIEW_PENDING"
      - name: Stamp proof-only draft metadata
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('preview');p.mkdir(exist_ok=True)
          report=dict(source_sha=os.environ.get('GITHUB_SHA'),draft_only=True,
                      final_film=False,visual_approved=False,
                      expected_chapters=14,expected_chapter_seconds=10,
                      proof_motion_chapters=[1,3,5,8,10,11,12],
                      action_still_frames={'3':145,'5':145,'10':195,'11':205,'12':180},
                      action_motion_start={'1':90,'3':118,'5':118,'8':118,'10':168,'11':152,'12':112},
                      status='DRAFT technical proof; inspect contact sheet AND action motion')
          (p/'DRAFT_QA.json').write_text(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jewel-wasp-v68-story-draft-preview
          path: preview/
          if-no-files-found: warn
          retention-days: 14
