name: Blender 3D Story (25 seconds)
on:
  workflow_dispatch:
  push:
    paths:
      - "src/blender_story.py"
      - "src/shot_library.py"
      - "src/story_events.py"
      - "src/blender_octopus_demo.py"
      - "src/animation_library.py"
      - "src/scene_library.py"
      - ".github/workflows/blender_story.yml"
concurrency:
  group: blender-3d-story
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  render:
    name: Render chapter ${{ matrix.shot }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shot: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Blender and FFmpeg
        timeout-minutes: 28
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v blender >/dev/null; then
            mkdir -p "$RUNNER_TEMP/blender"
            if timeout --signal=TERM --kill-after=15s 600s curl -fL --retry 3 --retry-delay 3 --connect-timeout 25 \
              -o "$RUNNER_TEMP/blender.tar.xz" \
              "https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz" &&
              tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1 &&
              test -x "$RUNNER_TEMP/blender/blender"; then
              echo "$RUNNER_TEMP/blender" >> "$GITHUB_PATH"
              export PATH="$RUNNER_TEMP/blender:$PATH"
            else
              echo "::warning::Portable Blender unavailable; trying Ubuntu packages"
              sudo sed -i 's@azure.archive.ubuntu.com@archive.ubuntu.com@g' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
              timeout 180s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=25 update -qq
              timeout 720s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends blender
            fi
          fi
          if ! ldconfig -p | grep -q 'libEGL.so.1' || ! command -v xvfb-run >/dev/null; then
            sudo sed -i 's@azure.archive.ubuntu.com@archive.ubuntu.com@g' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
            timeout 180s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=25 update -qq
            timeout 300s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 xvfb
          fi
          if ldd "$(command -v blender)" | grep 'not found'; then
            echo "::error::Missing Blender shared library"
            exit 1
          fi
          if ! command -v ffmpeg >/dev/null; then
            python -m pip install --quiet imageio-ffmpeg
            ffmpeg_path="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
            sudo ln -sf "$ffmpeg_path" /usr/local/bin/ffmpeg
          fi
          blender --version | head -n 2
          ffmpeg -version | head -n 1
      - name: Render and decode chapter
        run: |
          set -euo pipefail
          mkdir -p story_segments
          output="$PWD/story_segments/shot_${{ matrix.shot }}.mp4"
          BLENDER_OUTPUT="$output" STORY_SHOT="${{ matrix.shot }}" \
            xvfb-run -a blender -b -t 2 --python src/blender_story.py \
            2>&1 | tee "story_segments/shot_${{ matrix.shot }}.log"
          test -s "$output"
          grep -q "STORY_EVENT_READY ${{ matrix.shot }}" "story_segments/shot_${{ matrix.shot }}.log"
          ffmpeg -v error -xerror -i "$output" -f null -
          ffmpeg -y -loglevel error -ss 2.5 -i "$output" -frames:v 1 "story_segments/shot_${{ matrix.shot }}.jpg"
          echo "STORY_CHAPTER_DECODE_VERIFIED ${{ matrix.shot }}"
      - name: Upload verified chapter
        uses: actions/upload-artifact@v4
        with:
          name: octopus-story-shot-${{ matrix.shot }}
          path: |
            story_segments/shot_${{ matrix.shot }}.mp4
            story_segments/shot_${{ matrix.shot }}.jpg
            story_segments/shot_${{ matrix.shot }}.log
          if-no-files-found: error
          retention-days: 14
  assemble:
    name: Assemble and verify 25-second video
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: octopus-story-shot-*
          path: story_segments
          merge-multiple: true
      - name: Install FFmpeg tools if needed
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            python -m pip install --quiet imageio-ffmpeg
            ffmpeg_path="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
            sudo ln -sf "$ffmpeg_path" /usr/local/bin/ffmpeg
            sudo ln -sf "$ffmpeg_path" /usr/local/bin/ffprobe
            ffmpeg -version | head -n 1
          fi
      - name: Assemble and verify full video
        run: |
          set -euo pipefail
          mkdir -p videos
          : > story_segments/concat.txt
          for shot in 0 1 2 3 4; do
            test -s "story_segments/shot_$shot.mp4"
            printf "file 'shot_%s.mp4'\n" "$shot" >> story_segments/concat.txt
          done
          ffmpeg -y -hide_banner -loglevel error -f concat -safe 0 \
            -i story_segments/concat.txt -c copy -movflags +faststart videos/OCTOPUS_3D_STORY_25S.mp4
          ffmpeg -v error -xerror -i videos/OCTOPUS_3D_STORY_25S.mp4 -f null -
          ffmpeg -y -loglevel error -i videos/OCTOPUS_3D_STORY_25S.mp4 \
            -vf "select=eq(n\\,60)+eq(n\\,180)+eq(n\\,300)+eq(n\\,420)+eq(n\\,540),scale=216:384,tile=5x1" \
            -frames:v 1 videos/OCTOPUS_3D_STORY_CONTACT.jpg
          python - <<'PY'
          import json, os, subprocess, pathlib
          path = pathlib.Path("videos/OCTOPUS_3D_STORY_25S.mp4")
          data = json.loads(subprocess.check_output([
              "ffprobe","-v","error","-count_frames","-select_streams","v:0",
              "-show_entries","stream=width,height,r_frame_rate,nb_read_frames,duration",
              "-of","json",str(path)], text=True))
          stream = data["streams"][0]
          frames = int(stream["nb_read_frames"])
          duration = float(stream["duration"])
          result = {"video": str(path), "bytes": path.stat().st_size,
                    "frames": frames, "duration_seconds": duration,
                    "width": stream["width"], "height": stream["height"],
                    "fps": stream["r_frame_rate"],
                    "decode_ok": True, "source_commit": os.environ["GITHUB_SHA"]}
          result["verified"] = (
              frames == 600 and 24.9 <= duration <= 25.1
              and stream["width"] == 540 and stream["height"] == 960
              and path.stat().st_size > 100000)
          pathlib.Path("videos/octopus_story_qa.json").write_text(json.dumps(result, indent=2))
          print("STORY_QA", json.dumps(result))
          if not result["verified"]:
              raise SystemExit("Full 25-second video failed duration/frame/size QA")
          PY
      - name: Upload verified 25-second video
        uses: actions/upload-artifact@v4
        with:
          name: octopus-3d-story-25s
          path: |
            videos/OCTOPUS_3D_STORY_25S.mp4
            videos/OCTOPUS_3D_STORY_CONTACT.jpg
            videos/octopus_story_qa.json
          if-no-files-found: error
          retention-days: 30
      - name: Persist verified video in repository
        run: |
          set -euo pipefail
          git config user.name "blender-story-bot"
          git config user.email "blender-story-bot@users.noreply.github.com"
          git add -f videos/OCTOPUS_3D_STORY_25S.mp4 videos/OCTOPUS_3D_STORY_CONTACT.jpg videos/octopus_story_qa.json
          git commit -m "Publish verified 25-second octopus 3D story"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase -X theirs origin/main && git push origin HEAD:main; then
              echo "STORY_PUBLISHED_TO_MAIN"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 8
          done
          echo "::warning::Verified video is saved as an Actions artifact but could not be committed to main"
