name: Song Animation - verified checks and review drafts
on:
  schedule:
    - cron: '5 7 * * *'
  workflow_dispatch:
    inputs:
      audio_path:
        description: 'Song path on the selected branch; choose main for current uploads'
        required: false
        default: song_animation/inputs/song_1000076620.m4a
        type: string
      artwork:
        description: 'Original image cutouts or the legacy CPU renderer'
        type: choice
        default: flux-layers
        options: [flux-layers, painted-layers]
  push:
    branches: ['main', 'feature/song-animation-*']
    paths: ['song_animation/**', '.github/workflows/song_animation.yml']
permissions:
  contents: read
concurrency:
  group: song-animation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inputs:
    runs-on: ubuntu-latest
    outputs:
      audio: ${{ steps.select.outputs.audio }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
          MANUAL_AUDIO: ${{ inputs.audio_path }}
        run: python -m song_animation.select_inputs
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-cjk libcairo2
          pip install 'Pillow>=10,<13' 'numpy>=1.26,<3' 'requests>=2.31,<3' 'CairoSVG>=2.7,<3'
      - run: python -m unittest discover -s song_animation/tests -v
      - run: python -m song_animation.render --plan song_animation/examples/proof.json --out song_proof --width 1080
      - run: python -m song_animation.render --plan song_animation/examples/vector_smoke.json --out vector_proof --width 1080
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: song-motion-proof-${{ github.run_id }}
          path: |
            song_proof/
            vector_proof/
          retention-days: 7
  song-draft:
    permissions:
      contents: write
    needs: [proof, inputs]
    if: needs.inputs.outputs.audio != '[]'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        audio: ${{ fromJSON(needs.inputs.outputs.audio) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AUDIO_PATH: ${{ matrix.audio }}
      ARTWORK: ${{ inputs.artwork || 'flux-layers' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ""
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "120"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: song_animation/requirements.txt
      - name: Check input and planner access
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['AUDIO_PATH']).resolve()
          assert p.is_relative_to(Path.cwd()) and p.is_file(), 'Audio must be a repository file'
          assert os.environ.get('GEMINI_API_KEY'), 'Missing GEMINI_API_KEY'
          PY
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-cjk libcairo2
          pip install -r song_animation/requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: |
            song_draft/analysis_checkpoint.json
            song_draft/lyrics.json
            song_draft/vector_assets/
            song_draft/storyboard.json
            song_draft/story_candidate.json
            song_draft/vector_checkpoint.json
            song_draft/pipeline_checkpoint.json
            song_draft/review_contact.jpg
            song_draft/art_backend_choice.json
            song_draft/render_cache/
            song_draft/painted_environments/
            song_draft/painted_actors/
            song_draft/flux_images/
            song_draft/flux_assets/
          key: song-generated-v7-${{ hashFiles(matrix.audio) }}-${{ github.run_id }}
          restore-keys: |
            song-generated-v7-${{ hashFiles(matrix.audio) }}-
      - name: Check lyrics and connected story before loading the image models
        run: python -m song_animation.resume --audio "$AUDIO_PATH" --out song_draft --width 1080 --artwork "$ARTWORK" --stage plan
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--stabilityai--sd-turbo
          key: song-painted-sd-turbo-b261bac6
      - name: Install original cutout image backend
        if: env.ARTWORK == 'flux-layers'
        run: pip install -r song_animation/requirements-cutouts.txt
      - name: Install CPU painting backend after planning passed
        run: |
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r song_animation/requirements-painted.txt
      - name: Lyrics to connected animation draft
        run: python -m song_animation.resume --audio "$AUDIO_PATH" --out song_draft --width 1080 --artwork "$ARTWORK" --allow-local-recovery
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            song_draft/analysis_checkpoint.json
            song_draft/lyrics.json
            song_draft/vector_assets/
            song_draft/storyboard.json
            song_draft/story_candidate.json
            song_draft/vector_checkpoint.json
            song_draft/pipeline_checkpoint.json
            song_draft/review_contact.jpg
            song_draft/art_backend_choice.json
            song_draft/render_cache/
            song_draft/painted_environments/
            song_draft/painted_actors/
            song_draft/flux_images/
            song_draft/flux_assets/
          key: song-generated-v7-${{ hashFiles(matrix.audio) }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: song-draft-review-${{ github.run_id }}-${{ strategy.job-index }}
          path: song_draft/
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: song-checked-${{ github.run_id }}-${{ strategy.job-index }}
          path: |
            song_draft/checked.mp4
            song_draft/quality_gate.json
            song_draft/status.json
            song_draft/lyrics.srt
          if-no-files-found: error
          retention-days: 7

      - name: Record cleared source for automatic retry queue
        if: success()
        env:
          GH_RECEIPT_TOKEN: ${{ github.token }}
        run: python -m song_animation.completion --audio "$AUDIO_PATH" --out song_draft

      - name: Record attempt so one failed song cannot starve the retry queue
        if: always()
        env:
          GH_RECEIPT_TOKEN: ${{ github.token }}
        run: python -m song_animation.completion --audio "$AUDIO_PATH" --out song_draft --attempt

      - name: Show the actual song production status
        if: always()
        run: python -m song_animation.status_summary --out song_draft

