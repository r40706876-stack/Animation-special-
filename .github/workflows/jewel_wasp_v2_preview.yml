name: Jewel Wasp V2 Visual Proof
on:
  push:
    branches: [feature/jewel-wasp-visual-v2]
    paths:
      - "src/jewel_wasp_v2.py"
      - "src/jewel_wasp_full.py"
      - ".github/workflows/jewel_wasp_v2_preview.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jewel-wasp-v2-proof
  cancel-in-progress: false
jobs:
  visual-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and FFmpeg
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender"
          curl -fL --retry 3 --connect-timeout 25 --max-time 650 -o "$RUNNER_TEMP/blender.tar.xz" "https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz"
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1
          echo "$RUNNER_TEMP/blender" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libopengl0 ffmpeg
      - name: Render five representative story frames
        run: |
          set -euo pipefail
          mkdir -p preview
          for chapter in 0 3 7 10 13; do
            echo "PROOF_CHAPTER_START $chapter"
            JEWEL_PREVIEW=1 JEWEL_PREVIEW_FRAME=120 STORY_CHAPTER="$chapter" BLENDER_OUTPUT="$PWD/preview/chapter_$chapter.png" xvfb-run -a blender -b -t 2 --python src/jewel_wasp_full.py 2>&1 | tee "preview/chapter_$chapter.log"
            grep -q "JEWEL_V2_PREVIEW_DONE $chapter" "preview/chapter_$chapter.log"
            test -s "preview/chapter_$chapter.png"
          done
          ffmpeg -y -loglevel error -framerate 1 -pattern_type glob -i 'preview/chapter_*.png' -vf "scale=270:480,tile=5x1" -frames:v 1 preview/visual_contact.jpg
          test -s preview/visual_contact.jpg
          echo "JEWEL_V2_VISUAL_PROOF_READY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jewel-wasp-v2-visual-proof
          path: preview/
          if-no-files-found: warn
          retention-days: 14
